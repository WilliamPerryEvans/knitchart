name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Let the deploy replace an in-flight one, but never interrupt a running deploy.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The tests are pure TypeScript and need no Rust toolchain, so the deploy
      # can afford to gate on them.
      - run: npm test
      - run: npx tsc -b
      - run: npm run build
        env:
          # Project pages serve from /knitchart/. Set ONLY here: the Tauri
          # desktop build loads dist/ off the filesystem and breaks if asset
          # URLs carry a base path.
          GITHUB_PAGES: '1'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
